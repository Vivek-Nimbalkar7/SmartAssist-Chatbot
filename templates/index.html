<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAssist AI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🤖</div>

            <div>
                <h1>SmartAssist</h1>
                <p>AI Customer Support Assistant</p>
            </div>

            <span class="status">● Online</span>
        </header>

        <main>
            <div class="welcome">
                <h2>Hello! 👋</h2>
                <p>Welcome to SmartAssist. How can I help you today?</p>
            </div>

            <div id="chat-box" aria-live="polite">
                <div class="message bot">
                    Hi! Ask me about our services or working hours.
                </div>
            </div>

            <div class="suggestions">
                <button type="button" onclick="sendSuggestion('Hello')">
                    Say Hello
                </button>

                <button type="button"
                        onclick="sendSuggestion('What services do you offer?')">
                    Our Services
                </button>

                <button type="button"
                        onclick="sendSuggestion('What are your working hours?')">
                    Working Hours
                </button>
            </div>

            <form id="chat-form">
                <input
                    type="text"
                    id="message"
                    placeholder="Type your message..."
                    maxlength="1000"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="send-button">
                    Send ➤
                </button>
            </form>

            <p class="footer">
                SmartAssist · Python + Flask + SQLite
            </p>
        </main>

    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chatBox = document.getElementById("chat-box");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, sender) {
            const message = document.createElement("div");

            message.className = "message " + sender;
            message.textContent = text;

            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(text) {
            const message = text.trim();

            if (!message || sendButton.disabled) {
                return;
            }

            addMessage(message, "user");

            input.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.response || "Request failed.");
                }

                addMessage(data.response, "bot");

            } catch (error) {
                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot"
                );
                console.error(error);

            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            sendMessage(input.value);
        });

        function sendSuggestion(text) {
            sendMessage(text);
        }
    </script>

</body>
</html>
